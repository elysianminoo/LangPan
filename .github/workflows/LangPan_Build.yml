name: LangPan CI - Validate, Test and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'
  APPLICATION_ID: 'com.langpan.app'
  APP_VERSION: '0.2.0'
  APP_VERSION_CODE: '2'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require the current source package
        shell: bash
        run: |
          set -euo pipefail
          test -f LangPan_Source.zip || { echo '::error::LangPan_Source.zip is missing from repository root.'; exit 1; }
          unzip -t LangPan_Source.zip >/dev/null

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app_src
          mkdir app_src
          unzip -q LangPan_Source.zip -d app_src
          test -f app_src/pubspec.yaml || { echo '::error::The ZIP must contain pubspec.yaml at its root.'; find app_src -maxdepth 2 -type f -print; exit 1; }
          echo "SRC_DIR=$PWD/app_src" >> "$GITHUB_ENV"

      - name: Validate project files
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for f in pubspec.yaml analysis_options.yaml lib/main.dart test/widget_test.dart content/en/curriculum_map.json content/schemas/lesson.schema.json; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          grep -Eq '^version:[[:space:]]*0\.2\.0\+2$' pubspec.yaml
          grep -Eq '^[[:space:]]*flutter_lints:' pubspec.yaml
          grep -Eq '^include:[[:space:]]*package:flutter_lints/flutter.yaml[[:space:]]*$' analysis_options.yaml

      - name: Validate curriculum/content contracts
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected={'pre_a1','a1','a2','b1','b2','c1','c2'}
          data=json.loads(Path('content/en/curriculum_map.json').read_text())
          found={str(x.get('cefr','')).lower() for x in data.get('levels',[])}
          missing=expected-found
          if missing: raise SystemExit(f'Missing curriculum levels: {sorted(missing)}')
          required={'id','version','cefr','title','can_do','scenario','communicative_goal','vocabulary','grammar','listening','pronunciation','speaking','reading','writing','panda_conversation','retrieval','assessment','mastery','recovery','review'}
          lessons=sorted(Path('content').rglob('lesson_*.json'))
          if not lessons: raise SystemExit('No lessons found')
          for p in lessons:
            d=json.loads(p.read_text())
            miss=required-d.keys()
            if miss: raise SystemExit(f'{p}: missing {sorted(miss)}')
          print(f'Curriculum: {len(found)}/7 levels; lesson contracts: {len(lessons)}')
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.SRC_DIR }}
        run: flutter pub get

      - name: Format check
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test packages

      - name: Analyze
        working-directory: ${{ env.SRC_DIR }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ env.SRC_DIR }}
        run: flutter test

      - name: Prepare Android
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/app/build.gradle.kts && ! -f android/app/build.gradle ]]; then
            tmp="$RUNNER_TEMP/langpan_android"
            rm -rf "$tmp"
            flutter create --platforms=android --project-name=app --org=com.langpan "$tmp"
            cp -R "$tmp/android" ./android
          fi
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="LangPan"/' "$manifest"

      - name: Verify application id
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f android/app/build.gradle.kts ]]; then
            grep -q 'namespace = "com.langpan.app"' android/app/build.gradle.kts
            grep -q 'applicationId = "com.langpan.app"' android/app/build.gradle.kts
          else
            grep -Eq "namespace[[:space:]]+['\"]com.langpan.app['\"]" android/app/build.gradle
            grep -Eq "applicationId[[:space:]]+['\"]com.langpan.app['\"]" android/app/build.gradle
          fi

      - name: Build release APK
        working-directory: ${{ env.SRC_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/langpan-apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: LangPan-${{ env.APP_VERSION }}+${{ env.APP_VERSION_CODE }}-release
          path: |
            ${{ env.SRC_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/langpan-apk.sha256
          if-no-files-found: error
