name: Validate, test and build LangPan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: langpan-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: LangPan_Source.zip
  APP_VERSION: '0.1.0'
  APP_VERSION_CODE: '1'
  FLUTTER_VERSION: '3.47.4'
  JAVA_VERSION: '17'
  APPLICATION_ID: 'com.langpan.app'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || {
            echo "::error::${SOURCE_ZIP} is missing from repository root."
            exit 1
          }
          unzip -t "$SOURCE_ZIP" >/dev/null
          echo "Source ZIP is present and valid."

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app_src
          mkdir -p app_src
          unzip -q "$SOURCE_ZIP" -d app_src

          # Support either a ZIP containing the project at its root or one
          # containing a single top-level directory.
          if [ -f app_src/pubspec.yaml ]; then
            SRC_DIR="$PWD/app_src"
          else
            mapfile -t candidates < <(find app_src -mindepth 1 -maxdepth 1 -type d -print)
            if [ "${#candidates[@]}" -ne 1 ] || [ ! -f "${candidates[0]}/pubspec.yaml" ]; then
              echo "::error::Could not locate exactly one LangPan Flutter project in ${SOURCE_ZIP}."
              find app_src -maxdepth 2 -type f -print | sort
              exit 1
            fi
            SRC_DIR="${candidates[0]}"
          fi

          printf 'SRC_DIR=%s\n' "$SRC_DIR" >> "$GITHUB_ENV"
          echo "LangPan source directory: $SRC_DIR"

      - name: Validate source version and content
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "^version:[[:space:]]*${APP_VERSION//./\\.}\\+${APP_VERSION_CODE}$" pubspec.yaml || {
            echo "::error::pubspec.yaml version must be ${APP_VERSION}+${APP_VERSION_CODE}."
            grep '^version:' pubspec.yaml || true
            exit 1
          }

          test -f content/en/curriculum_map.json || {
            echo "::error::content/en/curriculum_map.json is missing."
            exit 1
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('content/en/curriculum_map.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          expected = {'pre_a1', 'a1', 'a2', 'b1', 'b2', 'c1', 'c2'}
          levels = data.get('levels', data if isinstance(data, list) else [])
          if not isinstance(levels, list):
              raise SystemExit('curriculum_map.json has no list of levels')

          found = set()
          for item in levels:
              if not isinstance(item, dict):
                  raise SystemExit('curriculum level entry is not an object')
              value = item.get('cefr') or item.get('cefrLevel') or item.get('id')
              if isinstance(value, str):
                  found.add(value.strip().lower().replace('-', '_').replace(' ', '_'))

          missing = expected - found
          if missing:
              raise SystemExit(f'Unexpected/incomplete curriculum levels. Missing: {sorted(missing)}; found: {sorted(found)}')

          print('Curriculum map levels: OK')
          PY

          echo "Source version and curriculum validation passed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      # IMPORTANT:
      # Do NOT run `flutter create .` in the real LangPan source tree.
      # It can rewrite pubspec.yaml / analysis_options.yaml and makes CI
      # nondeterministic. If Android is not yet committed to the source ZIP,
      # create a clean temporary Flutter shell and copy only its android/
      # project into the build workspace. The authored source remains untouched.
      - name: Prepare Android project without mutating LangPan source
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -d android ] && { [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ]; }; then
            echo "Android project already exists in LangPan source; using it unchanged."
          else
            TMP_DIR="$RUNNER_TEMP/langpan_android_template"
            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR"

            flutter create \
              --platforms=android \
              --project-name=app \
              --org=com.langpan \
              "$TMP_DIR"

            test -f "$TMP_DIR/android/app/build.gradle.kts" || {
              echo "::error::Flutter did not generate android/app/build.gradle.kts."
              exit 1
            }

            rm -rf android
            cp -R "$TMP_DIR/android" android

            # The generated template uses com.langpan.app because the
            # temporary project name is `app`. Verify rather than silently
            # accepting another application id.
            grep -q 'namespace = "com.langpan.app"' android/app/build.gradle.kts || {
              echo "::error::Generated Android namespace is not ${APPLICATION_ID}."
              grep -n 'namespace' android/app/build.gradle.kts || true
              exit 1
            }

            grep -q 'applicationId = "com.langpan.app"' android/app/build.gradle.kts || {
              echo "::error::Generated Android applicationId is not ${APPLICATION_ID}."
              grep -n 'applicationId' android/app/build.gradle.kts || true
              exit 1
            }

            echo "Android build shell prepared in workspace; LangPan source metadata was not regenerated."
          fi

          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          echo "Android project validation passed."

      - name: Install dependencies
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Verify Flutter metadata
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f analysis_options.yaml
          grep -Eq '^[[:space:]]*flutter_lints:' pubspec.yaml || {
            echo "::error::flutter_lints is not declared in pubspec.yaml."
            exit 1
          }
          grep -Eq '^include:[[:space:]]*package:flutter_lints/flutter.yaml' analysis_options.yaml || {
            echo "::error::analysis_options.yaml does not include flutter_lints."
            exit 1
          }
          echo "Authored Flutter metadata verified."

      - name: Format check
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test packages

      - name: Static analysis
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze

      - name: Unit and widget tests
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Content validation
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema = Path('content/schemas/lesson.schema.json')
          if not schema.is_file():
              raise SystemExit('Missing lesson schema: content/schemas/lesson.schema.json')

          lesson_files = sorted(Path('content/en').glob('**/lesson_*.json'))
          if not lesson_files:
              raise SystemExit('No lesson JSON files found')

          ids = set()
          for path in lesson_files:
              data = json.loads(path.read_text(encoding='utf-8'))
              lesson_id = data.get('id')
              if not lesson_id:
                  raise SystemExit(f'Missing lesson id: {path}')
              if lesson_id in ids:
                  raise SystemExit(f'Duplicate lesson id: {lesson_id}')
              ids.add(lesson_id)
              for field in ('cefr', 'title', 'can_do', 'assessment', 'mastery', 'recovery', 'review'):
                  if field not in data:
                      raise SystemExit(f'Missing required lesson field {field!r}: {path}')

          print(f'Content validation passed: {len(lesson_files)} lesson files.')
          PY

      - name: Verify application identity
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle.kts ]; then
            grep -q "namespace = \"${APPLICATION_ID}\"" android/app/build.gradle.kts
            grep -q "applicationId = \"${APPLICATION_ID}\"" android/app/build.gradle.kts
          else
            grep -q "namespace '${APPLICATION_ID}'\|namespace=\"${APPLICATION_ID}\"\|namespace \"${APPLICATION_ID}\"" android/app/build.gradle
            grep -q "applicationId '${APPLICATION_ID}'\|applicationId \"${APPLICATION_ID}\"" android/app/build.gradle
          fi
          echo "Application identity verified: ${APPLICATION_ID}"

      - name: Build release APK
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Calculate APK SHA-256
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/langpan-apk.sha256"

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: LangPan-${{ env.APP_VERSION }}+${{ env.APP_VERSION_CODE }}-release
          path: |
            ${{ env.SRC_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/langpan-apk.sha256
          if-no-files-found: error
