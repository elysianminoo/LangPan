name: LangPan CI - Validate, Normalize, Test and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: langpan-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  APPLICATION_ID: 'com.langpan.app'
  APP_VERSION: '0.6.0'
  APP_VERSION_CODE: '7'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require exact source package
        shell: bash
        run: |
          set -euo pipefail
          test -f LangPan_Source.zip || { echo '::error::LangPan_Source.zip is missing from repository root.'; exit 1; }
          unzip -t LangPan_Source.zip >/dev/null

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app_src
          mkdir -p app_src
          unzip -q LangPan_Source.zip -d app_src
          test -f app_src/pubspec.yaml || { echo '::error::ZIP root must contain pubspec.yaml.'; find app_src -maxdepth 2 -type f -print; exit 1; }
          echo "SRC_DIR=$PWD/app_src" >> "$GITHUB_ENV"

      - name: Validate source contract
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for f in pubspec.yaml analysis_options.yaml lib/main.dart test/widget_test.dart content/en/curriculum_map.json content/schemas/lesson.schema.json docs/DESIGN_SYSTEM.md docs/PANDA_SYSTEM.md docs/PEDAGOGY_RUNTIME.md assets/brand/langpan_logo_lockup.png assets/brand/panda_approved_hero.png assets/brand/panda_happy.png assets/brand/panda_thinking.png lib/src/speech_service.dart lib/src/speech_practice.dart lib/src/tts_service.dart lib/src/profile_store.dart assets/brand/langpan_icon.png; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          grep -Eq '^version:[[:space:]]*0\.6\.0\+7$' pubspec.yaml || { echo '::error::Expected version 0.6.0+7'; grep '^version:' pubspec.yaml || true; exit 1; }
          grep -Eq '^[[:space:]]*flutter_lints:' pubspec.yaml
          grep -Eq '^include:[[:space:]]*package:flutter_lints/flutter.yaml[[:space:]]*$' analysis_options.yaml
          test -s assets/brand/langpan_icon.png
          test -s assets/brand/langpan_logo_lockup.png
          test -s assets/brand/panda_approved_hero.png
          for mood in happy excited thinking confused proud encouraging calm listening speaking; do test -s "assets/brand/panda_${mood}.png"; done

      - name: Validate curriculum and lesson contracts
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected={'pre_a1','a1','a2','b1','b2','c1','c2'}
          data=json.loads(Path('content/en/curriculum_map.json').read_text(encoding='utf-8'))
          found={str(x.get('cefr','')).lower() for x in data.get('levels',[])}
          missing=expected-found
          if missing:
              raise SystemExit(f'Missing curriculum levels: {sorted(missing)}')
          required={'id','version','cefr','title','can_do','scenario','communicative_goal','vocabulary','grammar','listening','pronunciation','speaking','reading','writing','panda_conversation','retrieval','assessment','mastery','recovery','review'}
          lessons=sorted(Path('content').rglob('lesson_*.json'))
          if not lessons:
              raise SystemExit('No lessons found')
          ids=set()
          for p in lessons:
              d=json.loads(p.read_text(encoding='utf-8'))
              miss=required-set(d)
              if miss:
                  raise SystemExit(f'{p}: missing {sorted(miss)}')
              if d['id'] in ids:
                  raise SystemExit(f'Duplicate lesson id: {d["id"]}')
              ids.add(d['id'])
          print(f'Curriculum levels: {len(found)}/7; lesson contracts: {len(lessons)}')
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Save authored analyzer config
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cp analysis_options.yaml "$RUNNER_TEMP/langpan-analysis-options.yaml"

      - name: Install dependencies
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: flutter pub get

      - name: Restore authored analyzer config
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/langpan-analysis-options.yaml" analysis_options.yaml

      # Dart format is deterministic. The source is normalized first, then checked again.
      # This is not error suppression: syntax/analyzer/test failures still fail the job.
      - name: Normalize Dart formatting
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test packages

      - name: Verify Dart formatting
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test packages

      - name: Static analysis
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: flutter test

      - name: Prepare Android build project
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/app/build.gradle.kts && ! -f android/app/build.gradle ]]; then
            tmp="$RUNNER_TEMP/langpan_android"
            rm -rf "$tmp"
            flutter create --platforms=android --project-name=app --org=com.langpan "$tmp"
            cp -R "$tmp/android" ./android
          fi
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          if [[ -f android/app/build.gradle.kts ]]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
          # The template uses the project name ("app") as launcher label.
          manifest=android/app/src/main/AndroidManifest.xml
          test -f "$manifest"
          sed -i 's|android:label="[^"]*"|android:label="LangPan"|' "$manifest"
          grep -q 'android:label="LangPan"' "$manifest"

          python3 - "$manifest" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '    <uses-permission android:name="android.permission.INTERNET"/>',
          ]
          for line in permissions:
              if line not in text:
                  text = text.replace('<application', line + '\n    <application', 1)
          intents = [
              ('android.speech.RecognitionService', '        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n'),
              ('android.intent.action.TTS_SERVICE', '        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n'),
          ]
          missing = ''.join(block for key, block in intents if key not in text)
          if missing:
              if '<queries>' in text:
                  # The Flutter template already declares a <queries> block.
                  text = text.replace('<queries>', '<queries>\n' + missing.rstrip('\n'), 1)
              else:
                  text = text.replace('<application', '<queries>\n' + missing + '    </queries>\n    <application', 1)
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/langpan_icon"')
          path.write_text(text, encoding='utf-8')
          PY
          mkdir -p android/app/src/main/res/drawable
          cp assets/brand/langpan_icon.png android/app/src/main/res/drawable/langpan_icon.png
          test -s android/app/src/main/res/drawable/langpan_icon.png

      - name: Verify Android audio and approved LangPan brand resources
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' "$manifest"
          grep -q 'android.speech.RecognitionService' "$manifest"
          grep -q 'android.intent.action.TTS_SERVICE' "$manifest"
          grep -q 'android:icon="@drawable/langpan_icon"' "$manifest"
          test -s android/app/src/main/res/drawable/langpan_icon.png

      - name: Verify Android identity
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f android/app/build.gradle.kts ]]; then
            grep -q 'namespace = "com.langpan.app"' android/app/build.gradle.kts
            grep -q 'applicationId = "com.langpan.app"' android/app/build.gradle.kts
          else
            grep -Eq "namespace[[:space:]]+['\"]com.langpan.app['\"]" android/app/build.gradle
            grep -Eq "applicationId[[:space:]]+['\"]com.langpan.app['\"]" android/app/build.gradle
          fi

      - name: Build release APK
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: flutter build apk --release

      - name: Verify APK and checksum
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/langpan-apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: LangPan-${{ env.APP_VERSION }}+${{ env.APP_VERSION_CODE }}-release
          path: |
            ${{ env.SRC_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/langpan-apk.sha256
          if-no-files-found: error
