name: Validate, test and build LangPan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: langpan-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '0.1.0'
  APP_VERSION_CODE: '1'
  FLUTTER_VERSION: '3.47.4'
  JAVA_VERSION: '17'
  APPLICATION_ID: 'com.langpan.app'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate LangPan source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          # Preferred delivery: LangPan_Source.zip in repository root.
          if [ -f "LangPan_Source.zip" ]; then
            echo "SOURCE_MODE=zip" >> "$GITHUB_ENV"
            echo "SOURCE_ZIP=LangPan_Source.zip" >> "$GITHUB_ENV"
            unzip -t LangPan_Source.zip >/dev/null
            echo "Using LangPan_Source.zip"
            exit 0
          fi

          # Accept a uniquely named LangPan_Source*.zip as well. This avoids
          # a false failure caused only by a suffix such as _FIXED2.
          mapfile -t zips < <(find . -maxdepth 1 -type f -name 'LangPan_Source*.zip' -printf '%f\n' | sort)
          if [ "${#zips[@]}" -eq 1 ]; then
            echo "SOURCE_MODE=zip" >> "$GITHUB_ENV"
            echo "SOURCE_ZIP=${zips[0]}" >> "$GITHUB_ENV"
            unzip -t "${zips[0]}" >/dev/null
            echo "Using ${zips[0]}"
            exit 0
          fi

          # Also support a committed Flutter source tree. This makes the
          # repository itself a valid source of truth and removes dependence
          # on a binary ZIP when the source is committed normally.
          if [ -f pubspec.yaml ] && [ -d lib ] && [ -d content ]; then
            echo "SOURCE_MODE=tree" >> "$GITHUB_ENV"
            echo "SRC_DIR=$PWD" >> "$GITHUB_ENV"
            echo "Using committed LangPan source tree."
            exit 0
          fi

          echo "::error::No LangPan source found. Upload LangPan_Source.zip (or LangPan_Source*.zip) to the repository root, or commit the Flutter source tree." 
          echo "Repository root contents:"
          find . -maxdepth 2 -type f -print | sort
          exit 1

      - name: Extract source ZIP
        if: env.SOURCE_MODE == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app_src
          mkdir -p app_src
          unzip -q "$SOURCE_ZIP" -d app_src

          if [ -f app_src/pubspec.yaml ]; then
            SRC_DIR="$PWD/app_src"
          else
            mapfile -t candidates < <(find app_src -mindepth 1 -maxdepth 1 -type d -print)
            if [ "${#candidates[@]}" -ne 1 ] || [ ! -f "${candidates[0]}/pubspec.yaml" ]; then
              echo "::error::Could not locate exactly one Flutter project in $SOURCE_ZIP."
              find app_src -maxdepth 3 -type f -print | sort
              exit 1
            fi
            SRC_DIR="${candidates[0]}"
          fi

          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "LangPan source directory: $SRC_DIR"

      - name: Validate source version and curriculum
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          grep -Eq "^version:[[:space:]]*${APP_VERSION//./\\.}\\+${APP_VERSION_CODE}$" pubspec.yaml || {
            echo "::error::pubspec.yaml version must be ${APP_VERSION}+${APP_VERSION_CODE}."
            grep '^version:' pubspec.yaml || true
            exit 1
          }

          test -f content/en/curriculum_map.json || {
            echo "::error::content/en/curriculum_map.json is missing."
            exit 1
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('content/en/curriculum_map.json').read_text(encoding='utf-8'))
          expected = {'pre_a1', 'a1', 'a2', 'b1', 'b2', 'c1', 'c2'}
          levels = data.get('levels', data if isinstance(data, list) else [])
          if not isinstance(levels, list):
              raise SystemExit('curriculum_map.json has no list of levels')

          found = set()
          for item in levels:
              if not isinstance(item, dict):
                  raise SystemExit('curriculum level entry is not an object')
              value = item.get('cefr') or item.get('cefrLevel') or item.get('id')
              if isinstance(value, str):
                  found.add(value.strip().lower().replace('-', '_').replace(' ', '_'))

          missing = expected - found
          if missing:
              raise SystemExit(f'Incomplete curriculum levels. Missing: {sorted(missing)}; found: {sorted(found)}')

          print('Curriculum map levels: OK')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      - name: Verify authored Flutter metadata
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f analysis_options.yaml

          grep -Eq '^[[:space:]]*flutter_lints:[[:space:]]*' pubspec.yaml || {
            echo "::error::LangPan source is missing flutter_lints."
            exit 1
          }

          grep -Eq '^include:[[:space:]]*package:flutter_lints/flutter.yaml[[:space:]]*$' analysis_options.yaml || {
            echo "::error::analysis_options.yaml is missing the flutter_lints include."
            exit 1
          }

          cp pubspec.yaml "$RUNNER_TEMP/langpan-pubspec-authored.yaml"
          cp analysis_options.yaml "$RUNNER_TEMP/langpan-analysis-authored.yaml"
          sha256sum pubspec.yaml analysis_options.yaml | tee "$RUNNER_TEMP/langpan-metadata-authored.sha256"

      - name: Install dependencies
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Restore and verify authored metadata
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/langpan-pubspec-authored.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/langpan-analysis-authored.yaml" analysis_options.yaml
          sha256sum -c "$RUNNER_TEMP/langpan-metadata-authored.sha256"

      - name: Prepare Android project without mutating authored source
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f android/app/build.gradle.kts ] || [ -f android/app/build.gradle ]; then
            echo "Committed Android project found; using it."
          else
            TMP_DIR="$RUNNER_TEMP/langpan_android_template"
            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR"

            flutter create --platforms=android --project-name=app --org=com.langpan "$TMP_DIR"

            test -f "$TMP_DIR/android/app/build.gradle.kts" || {
              echo "::error::Flutter did not generate the Android Gradle project."
              exit 1
            }

            rm -rf android
            cp -R "$TMP_DIR/android" android
          fi

          if [ -f android/app/build.gradle.kts ]; then
            grep -q 'namespace = "com.langpan.app"' android/app/build.gradle.kts || {
              echo "::error::Android namespace is not ${APPLICATION_ID}."
              grep -n 'namespace' android/app/build.gradle.kts || true
              exit 1
            }
            grep -q 'applicationId = "com.langpan.app"' android/app/build.gradle.kts || {
              echo "::error::Android applicationId is not ${APPLICATION_ID}."
              grep -n 'applicationId' android/app/build.gradle.kts || true
              exit 1
            }
          else
            grep -Eq "namespace[[:space:]]+['\"]${APPLICATION_ID}['\"]" android/app/build.gradle
            grep -Eq "applicationId[[:space:]]+['\"]${APPLICATION_ID}['\"]" android/app/build.gradle
          fi

      - name: Format check
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test packages

      - name: Static analysis
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze

      - name: Unit and widget tests
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Content validation
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/validate_content.py

      - name: Verify application identity
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle.kts ]; then
            grep -q "namespace = \"${APPLICATION_ID}\"" android/app/build.gradle.kts
            grep -q "applicationId = \"${APPLICATION_ID}\"" android/app/build.gradle.kts
          else
            grep -Eq "namespace[[:space:]]+['\"]${APPLICATION_ID}['\"]" android/app/build.gradle
            grep -Eq "applicationId[[:space:]]+['\"]${APPLICATION_ID}['\"]" android/app/build.gradle
          fi

      - name: Build release APK
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Calculate APK SHA-256
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/langpan-apk.sha256"

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: LangPan-${{ env.APP_VERSION }}+${{ env.APP_VERSION_CODE }}-release
          path: |
            ${{ env.SRC_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/langpan-apk.sha256
          if-no-files-found: error
