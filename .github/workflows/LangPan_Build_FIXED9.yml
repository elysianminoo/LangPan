name: LangPan CI - Validate, Test and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: langpan-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  JAVA_VERSION: '17'
  APPLICATION_ID: 'com.langpan.app'
  APP_VERSION: '0.1.0'
  APP_VERSION_CODE: '1'

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate exact LangPan source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="LangPan_Source.zip"

          if [[ ! -f "$SOURCE_ZIP" ]]; then
            echo "::error::LangPan_Source.zip is missing from repository root."
            echo "::error::Upload the supplied LangPan_Source_FIXED9.zip as exactly: LangPan_Source.zip"
            exit 1
          fi

          unzip -t "$SOURCE_ZIP" >/dev/null
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app_src
          mkdir -p app_src
          unzip -q "$SOURCE_ZIP" -d app_src

          if [[ ! -f app_src/pubspec.yaml ]]; then
            echo "::error::The source ZIP must contain pubspec.yaml at its root."
            find app_src -maxdepth 2 -type f -print | sort
            exit 1
          fi

          echo "SRC_DIR=$PWD/app_src" >> "$GITHUB_ENV"

      - name: Validate project structure
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          required=(
            pubspec.yaml
            analysis_options.yaml
            lib/main.dart
            test/widget_test.dart
            content/en/curriculum_map.json
            content/schemas/lesson.schema.json
          )

          for file in "${required[@]}"; do
            [[ -f "$file" ]] || {
              echo "::error::Required file missing: $file"
              exit 1
            }
          done

      - name: Validate version and Flutter metadata
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "^version:[[:space:]]*0\.1\.0\+1$" pubspec.yaml
          grep -Eq '^[[:space:]]*flutter_lints:[[:space:]]*' pubspec.yaml
          grep -Eq '^include:[[:space:]]*package:flutter_lints/flutter.yaml[[:space:]]*$' analysis_options.yaml

      - name: Validate curriculum and lesson contracts
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {"pre_a1", "a1", "a2", "b1", "b2", "c1", "c2"}

          curriculum = json.loads(Path("content/en/curriculum_map.json").read_text(encoding="utf-8"))
          levels = curriculum.get("levels")
          if not isinstance(levels, list):
              raise SystemExit("curriculum_map.json: 'levels' must be a list")

          found = set()
          for level in levels:
              if not isinstance(level, dict):
                  raise SystemExit("curriculum_map.json: every level must be an object")
              value = level.get("cefr") or level.get("cefrLevel") or level.get("id")
              if isinstance(value, str):
                  found.add(value.strip().lower().replace("-", "_").replace(" ", "_"))

          missing = expected - found
          if missing:
              raise SystemExit(f"Missing curriculum levels: {sorted(missing)}")

          required = {
              "id", "version", "cefr", "title", "can_do", "scenario",
              "communicative_goal", "vocabulary", "grammar", "listening",
              "pronunciation", "speaking", "reading", "writing",
              "panda_conversation", "retrieval", "assessment", "mastery",
              "recovery", "review",
          }

          lessons = sorted(Path("content").rglob("lesson_*.json"))
          if not lessons:
              raise SystemExit("No lesson JSON files found")

          for path in lessons:
              data = json.loads(path.read_text(encoding="utf-8"))
              missing_keys = required - data.keys()
              if missing_keys:
                  raise SystemExit(f"{path}: missing fields {sorted(missing_keys)}")

          print(f"Curriculum levels: {len(found)}/7 OK")
          print(f"Lesson contracts: {len(lessons)} OK")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      - name: Snapshot authored configuration
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.authored"
          cp analysis_options.yaml "$RUNNER_TEMP/analysis.authored"

      - name: Install dependencies
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Restore authored configuration
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/pubspec.authored" pubspec.yaml
          cp "$RUNNER_TEMP/analysis.authored" analysis_options.yaml

      - name: Verify Dart formatting
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking Dart formatting without modifying source..."
          dart format --output=none --set-exit-if-changed lib test packages
          echo "Dart formatting: OK"

      - name: Static analysis
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze

      - name: Unit and widget tests
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Content validation
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tool/validate_content.py ]]; then
            python3 tool/validate_content.py
          else
            echo "Content contract validation was completed by the structural validator."
          fi

      - name: Prepare Android project
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f android/app/build.gradle.kts || -f android/app/build.gradle ]]; then
            echo "Using committed Android project."
          else
            TMP="$RUNNER_TEMP/langpan_android_template"
            rm -rf "$TMP"
            mkdir -p "$TMP"

            # org + project-name => com.langpan.app
            flutter create \
              --platforms=android \
              --project-name=app \
              --org=com.langpan \
              "$TMP"

            test -f "$TMP/android/app/build.gradle.kts" || test -f "$TMP/android/app/build.gradle"
            cp -R "$TMP/android" ./android
          fi

          test -f android/app/build.gradle.kts || test -f android/app/build.gradle

      - name: Verify Android application identity
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f android/app/build.gradle.kts ]]; then
            grep -q "namespace = \"${APPLICATION_ID}\"" android/app/build.gradle.kts
            grep -q "applicationId = \"${APPLICATION_ID}\"" android/app/build.gradle.kts
          else
            grep -Eq "namespace[[:space:]]+['\"]${APPLICATION_ID}['\"]" android/app/build.gradle
            grep -Eq "applicationId[[:space:]]+['\"]${APPLICATION_ID}['\"]" android/app/build.gradle
          fi

          echo "Application identity verified: ${APPLICATION_ID}"

      - name: Build release APK
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify APK and SHA-256
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          [[ -f "$APK" ]] || {
            echo "::error::Release APK was not produced."
            exit 1
          }
          sha256sum "$APK" | tee "$RUNNER_TEMP/langpan-apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: LangPan-${{ env.APP_VERSION }}+${{ env.APP_VERSION_CODE }}-release
          path: |
            ${{ env.SRC_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/langpan-apk.sha256
          if-no-files-found: error
